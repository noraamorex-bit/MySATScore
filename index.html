<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MySATScore</title>
<!--
  Redirect to the landing page in docs/.

  GitHub Pages can be configured three ways, and the landing page should work
  under all of them without anyone having to change a setting:

    source: GitHub Actions        -> .github/workflows/pages.yml publishes docs/
    source: branch, folder /docs  -> docs/index.html is served directly
    source: branch, folder / root -> this file redirects to docs/

  Under the first two, this file is never reached. It exists only for the third.
-->
<link rel="canonical" href="./docs/">
<meta http-equiv="refresh" content="0; url=./docs/">
<script>location.replace("./docs/" + location.search + location.hash);</script>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f6f6f3; color: #181b22; text-align: center;
    font: 15px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #0f1115; color: #e9ecf1; } }
  a { color: #1e448f; }
  @media (prefers-color-scheme: dark) { a { color: #84a8ee; } }
</style>
</head>
<body>
  <p>Redirecting to <a href="./docs/">MySATScore</a>…</p>
</body>
</html>
