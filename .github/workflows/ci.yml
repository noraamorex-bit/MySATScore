# Runs the checks that must pass before the app is deployed anywhere.
#
# The suites run against a real PostgreSQL service rather than a stand-in, so
# CI exercises the same database engine production uses.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mysatscore
        ports: ["5432:5432"]
        # Don't start the job until the database is actually accepting queries.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mysatscore"
      AUTH_SECRET: "ci-only-secret-at-least-thirty-two-chars"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma db push --skip-generate
      # Verifies the bank, the full attempt lifecycle, and the admin surface.
      - run: npm test
      - run: npm run build

      # prisma/init.sql is what a deployer pastes into their database console,
      # so it must stay in step with the schema. Regenerate it and fail if the
      # committed copy has drifted.
      - name: Check the generated schema files are up to date
        run: |
          npx prisma migrate diff \
            --from-empty --to-schema-datamodel prisma/schema.prisma --script \
            > /tmp/init.generated.sql
          strip() { grep -v '^--' "$1" | grep -v '^[[:space:]]*$'; }
          if ! diff <(strip prisma/init.sql) <(strip /tmp/init.generated.sql) > /dev/null; then
            echo "prisma/init.sql is out of date. Regenerate it with:"
            echo "  npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script"
            exit 1
          fi
          npx tsx scripts/generate-schema-sql.ts
          if ! git diff --quiet -- src/lib/schema-sql.ts; then
            echo "src/lib/schema-sql.ts is out of date. Regenerate it with:"
            echo "  npx tsx scripts/generate-schema-sql.ts"
            exit 1
          fi
          echo "prisma/init.sql and src/lib/schema-sql.ts both match the schema."
